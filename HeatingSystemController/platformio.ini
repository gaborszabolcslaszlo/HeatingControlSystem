[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.filesystem = spiffs
extra_scripts = pre:pre_buildfs.py
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson@^7.4.3
	arduino-libraries/NTPClient@^3.2.1
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	links2004/WebSockets@^2.7.3
	janelia-arduino/PCA9685@^3.0.3
	

;build_unflags = -fno-exceptions
build_flags = -fexceptions -DAPPLICATION_LOG_LEVEL=3 ;-DRNADOM_DATA

debug_tool = esp-prog
debug_init_break = tbreak setup  # Indításkor megáll a setup() függvénynél

