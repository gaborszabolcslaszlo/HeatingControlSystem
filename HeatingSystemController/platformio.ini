[env:esp32dev]
platform = espressif32@^6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
board_build.partitions = partitions_4mb_web.csv
extra_scripts = pre:pre_buildfs.py
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    arduino-libraries/NTPClient@^3.2.1
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6
    links2004/WebSockets@^2.7.3
    janelia-arduino/PCA9685@^3.0.3
build_flags = -fexceptions -DAPPLICATION_LOG_LEVEL=3

[env:esp32dev_testOverAPI]
extends = env:esp32dev
build_flags = -fexceptions -DTESTINGOVER_API -DAPPLICATION_LOG_LEVEL=3

[env:esp32cam]
extends = env:esp32dev
board = esp32cam
build_flags = -fexceptions -DAPPLICATION_LOG_LEVEL=3 -DESP32_CAM

[env:esp32cam_testOverAPI]
extends = env:esp32cam
build_flags = -fexceptions -DTESTINGOVER_API -DAPPLICATION_LOG_LEVEL=3 -DESP32_CAM

[env:linux_test]
platform = native
test_framework = unity

# Additional Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.4.3

# Code coverage flags
build_flags =
	-DVERBOSE_BUILD=1
    -DUNIT_TESTING
	-DunitTesting
    -lgcov
    -coverage
    -fprofile-arcs
	-fprofile-abs-path
    -ftest-coverage
	-I src/HeatingSystemElements
	-I src
	-I test

#build_src_filter = +<src/> +<test/> +<HeatingSystemElements/> -<exclude_dir/>


# Enable debug, if needed
build_type = debug
monitor_speed = 115200

# Debugger configuration (optional, if you need debugging)
debug_tool = gdb
debug_init_break = tbreak setup
